<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giada Caneva Santoro</title>
<meta name="description" content="Giada Caneva Santoro — postdoctoral researcher, Niels Bohr Institute. Black holes and gravitational waves.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,560;1,9..144,420;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/hero.css?v=20261014">
</head>
<body>
<div class="hero-page">

  <a class="hero-name" href="about.html">Giada Caneva Santoro</a>

  <div class="hero-stage">
    <a class="hero-link" href="explore.html" aria-label="Enter the site">
      <svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="spec1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"  stop-color="#ff7a3d"/>
            <stop offset="18%" stop-color="#ffd23d"/>
            <stop offset="38%" stop-color="#fff7ea"/>
            <stop offset="55%" stop-color="#bdeeff"/>
            <stop offset="75%" stop-color="#7fb8ff"/>
            <stop offset="92%" stop-color="#b98cff"/>
            <stop offset="100%" stop-color="#ff7a3d"/>
          </linearGradient>
          <linearGradient id="spec2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"  stop-color="#fff7ea"/>
            <stop offset="30%" stop-color="#ffd23d"/>
            <stop offset="60%" stop-color="#ff7a3d"/>
            <stop offset="100%" stop-color="#7a3dff" stop-opacity="0.4"/>
          </linearGradient>
          <radialGradient id="haze" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffdca0" stop-opacity="0.55"/>
            <stop offset="45%" stop-color="#ff9a4d" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </radialGradient>
          <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="6" result="b1"/>
            <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="14"/>
          </filter>
        </defs>

        <ellipse cx="450" cy="310" rx="420" ry="230" fill="url(#haze)"/>

        <g class="hero-spin">
          <g transform="rotate(-8 450 310)">
            <ellipse cx="450" cy="290" rx="150" ry="230" fill="none"
              stroke="url(#spec2)" stroke-width="7" opacity="0.85" filter="url(#glow)"/>
          </g>
          <g transform="rotate(-10 450 310)">
            <ellipse cx="450" cy="310" rx="330" ry="80" fill="none"
              stroke="url(#spec1)" stroke-width="14" filter="url(#glow)"/>
          </g>
          <circle cx="450" cy="310" r="118" fill="#040406"/>
          <circle cx="450" cy="310" r="118" fill="none" stroke="#040406" stroke-width="30" filter="url(#glowSoft)" opacity="0.9"/>
          <g transform="rotate(-10 450 310)">
            <path d="M 195 310 A 255 55 0 0 0 705 310" fill="none"
              stroke="url(#spec1)" stroke-width="10" filter="url(#glow)" opacity="0.95"/>
          </g>
          <circle cx="450" cy="310" r="118" fill="none" stroke="#ffe9c7" stroke-width="1.5" opacity="0.5"/>
        </g>
      </svg>
    </a>
  </div>

  <p class="hero-hint">Enter</p>
</div>
<div class="astro-widget" id="astro-widget">
  <button type="button" class="astro-btn" id="astro-btn" aria-expanded="false" aria-label="Site visitors">
    <svg class="astro-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="24" cy="19" r="10"/>
      <path d="M16.5,17 C18,13.5 20.5,12 24,12" opacity=".55"/>
      <path d="M15,30 C15,26.5 19,24.5 24,24.5 C29,24.5 33,26.5 33,30 L34,39 C34,41.8 30,43.5 24,43.5 C18,43.5 14,41.8 14,39 Z"/>
      <path d="M15,31 C10,33 7.5,37 8.5,41"/>
      <path d="M33,31 C38,33 40.5,37 39.5,41"/>
      <circle cx="20" cy="33" r="1.3" fill="currentColor" stroke="none" opacity=".8"/>
      <circle cx="28" cy="33" r="1.3" fill="currentColor" stroke="none" opacity=".8"/>
    </svg>
  </button>
  <div class="astro-panel" id="astro-panel" aria-hidden="true">
    <p class="astro-count" id="astro-count" aria-live="polite">counting infalling astronauts&hellip;</p>
    <a class="astro-link" href="https://giadacanevasantoro.goatcounter.com" target="_blank" rel="noopener">See where they're from &rarr;</a>
  </div>
</div>
<script>
(function(){
  var btn = document.getElementById('astro-btn');
  var panel = document.getElementById('astro-panel');
  var countEl = document.getElementById('astro-count');
  var open = false, loaded = false;

  function setOpen(v){
    open = v;
    panel.classList.toggle('is-open', open);
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open && !loaded) loadCount();
  }
  function loadCount(){
    loaded = true;
    fetch('https://giadacanevasantoro.goatcounter.com/counter/TOTAL.json')
      .then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(data){
        var n = data && data.count;
        countEl.innerHTML = n
          ? '<span class="n">' + n + '</span> infalling astronauts have crossed the horizon'
          : 'The counter is still waking up.';
      })
      .catch(function(){
        countEl.textContent = 'The counter is still waking up — check back soon.';
        loaded = false;
      });
  }
  btn.addEventListener('click', function(e){ e.stopPropagation(); setOpen(!open); });
  document.addEventListener('click', function(e){
    if (open && !e.target.closest('#astro-widget')) setOpen(false);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && open) setOpen(false);
  });
})();
</script>
<script data-goatcounter="https://giadacanevasantoro.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
