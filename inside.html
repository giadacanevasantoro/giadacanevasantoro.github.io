<script>
(function(){
  var caption = document.getElementById('hz-caption');
  var cubeScene = document.getElementById('cube-scene');
  var cube = document.getElementById('hz-cube');
  var layers = document.getElementById('hz-layers');
  var closeBtn = document.getElementById('hz-layers-close');

  function hideCaption(){
    caption.classList.remove('is-visible');
    caption.textContent = '';
  }
  function showCaption(text){
    hideCaption();
    requestAnimationFrame(function(){
      caption.textContent = text;
      caption.classList.add('is-visible');
    });
  }
  function openLayers(){
    hideCaption();
    cubeScene.classList.add('is-hidden');
    layers.classList.add('is-open');
    layers.setAttribute('aria-hidden', 'false');
  }
  function closeLayers(){
    layers.classList.remove('is-open');
    layers.setAttribute('aria-hidden', 'true');
    cubeScene.classList.remove('is-hidden');
  }

  var reveals = {
    books: "A standing seat at the local reading club.",
    art: "Documentaries and small stages, more than blockbusters."
  };

  cube.querySelectorAll('.cube-face[data-topic]').forEach(function(face){
    face.addEventListener('click', function(e){
      e.stopPropagation();
      var topic = face.getAttribute('data-topic');
      if (topic === 'music') { openLayers(); }
      else { showCaption(reveals[topic]); }
    });
  });

  closeBtn.addEventListener('click', function(e){ e.stopPropagation(); closeLayers(); });

  document.addEventListener('click', function(e){
    if (!layers.classList.contains('is-open')) hideCaption();
  });
})();
</script>
<div class="astro-widget" id="astro-widget">
  <button type="button" class="astro-btn" id="astro-btn" aria-expanded="false" aria-label="Site visitors">

      <path d="M15,31 C10,33 7.5,37 8.5,41"/>
      <path d="M33,31 C38,33 40.5,37 39.5,41"/>
      <circle cx="20" cy="33" r="1.3" fill="currentColor" stroke="none" opacity=".8"/>

  <div class="astro-panel" id="astro-panel" aria-hidden="true">
    <p class="astro-count" id="astro-count" aria-live="polite">counting infalling astronauts&hellip;</p>
    <a class="astro-link" href="https://giadacanevasantoro.goatcounter.com" target="_blank" rel="noopener">See where they're from &rarr;</a>
  </div>
</div>
<script>
(function(){
  var btn = document.getElementById('astro-btn');
  var panel = document.getElementById('astro-panel');
  var countEl = document.getElementById('astro-count');
  var open = false, loaded = false;

  function setOpen(v){
    open = v;
    panel.classList.toggle('is-open', open);
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open && !loaded) loadCount();
  }
  function loadCount(){
    loaded = true;
    fetch('https://giadacanevasantoro.goatcounter.com/counter/TOTAL.json')
      .then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(data){
        var n = data && data.count;
        countEl.innerHTML = n
          ? '<span class="n">' + n + '</span> infalling astronauts have crossed the horizon'
          : 'The counter is still waking up.';
      })
      .catch(function(){
        countEl.textContent = 'The counter is still waking up — check back soon.';
        loaded = false;
      });
  }
  btn.addEventListener('click', function(e){ e.stopPropagation(); setOpen(!open); });
  document.addEventListener('click', function(e){
    if (open && !e.target.closest('#astro-widget')) setOpen(false);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && open) setOpen(false);
  });
})();
</script>
<script data-goatcounter="https://giadacanevasantoro.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
