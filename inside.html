<body>
<div class="hero-page horizon-page">

  <a class="hero-name" href="index.html">Giada Caneva Santoro</a>
  <nav class="about-nav-links">
    <a href="about.html">About</a>
    <a href="research.html">Research</a>
    <a href="publications.html">Publications</a>
    <a href="talks.html">Talks &amp; CV</a>
  </nav>

  <div class="horizon-stage">
    <p class="horizon-eyebrow">a few things, quietly</p>

    <div class="cube-scene" id="cube-scene">
      <div class="horizon-blob" aria-hidden="true">
        <svg class="blob-svg" viewBox="0 0 300 300">
          <defs>
            <radialGradient id="blobGrad" cx="50%" cy="45%" r="62%">
              <stop offset="0%"  stop-color="#fff6e8"/>
              <stop offset="16%" stop-color="#ffd9a8"/>
              <stop offset="36%" stop-color="#8fd8ff"/>
              <stop offset="58%" stop-color="#a99bff"/>
              <stop offset="80%" stop-color="#ff9ad1"/>
              <stop offset="100%" stop-color="#040406" stop-opacity="0"/>
            </radialGradient>
            <filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="9"/>
            </filter>
          </defs>
          <path class="blob-shape" fill="url(#blobGrad)" filter="url(#blobBlur)"
            d="M150,38 C208,44 252,88 258,150 C264,212 214,258 150,260 C86,262 40,214 38,150 C36,86 92,32 150,38 Z"/>
        </svg>
      </div>

      <div class="cube-perspective">
        <div class="cube" id="hz-cube">
          <button type="button" class="cube-face face-front" data-topic="music" aria-label="Music">
            <svg class="face-icon" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="21" cy="43" rx="7" ry="5" transform="rotate(-18 21 43)"/>
              <line x1="27.5" y1="41.5" x2="27.5" y2="12"/>
              <path d="M27.5,12 C38,14 40,23 31,27"/>
            </svg>
            <span class="face-label">Music</span>
          </button>
          <button type="button" class="cube-face face-right" data-topic="art" aria-label="Art">
            <svg class="face-icon" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M30,10 C44,10 52,20 52,32 C52,40 46,42 40,40 C36,38.5 33,40 33,44 C33,48 29,50 24,48 C12,44 8,36 8,28 C8,16 17,10 30,10 Z"/>
              <circle cx="24" cy="26" r="4"/>
              <circle cx="18" cy="34" r="2.6" fill="#ffb37a" stroke="none"/>
              <circle cx="31" cy="19.5" r="2.6" fill="#a99bff" stroke="none"/>
              <circle cx="43" cy="30" r="2.6" fill="#7fe3e3" stroke="none"/>
            </svg>
            <span class="face-label">Art</span>
          </button>
          <button type="button" class="cube-face face-left" data-topic="books" aria-label="Books">
            <svg class="face-icon" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <line x1="30" y1="14" x2="30" y2="48"/>
              <path d="M8,18 C16,12 24,13 30,17 L30,47 C24,43 16,42 8,47 Z"/>
              <path d="M52,18 C44,12 36,13 30,17 L30,47 C36,43 44,42 52,47 Z"/>
            </svg>
            <span class="face-label">Books</span>
          </button>
          <div class="cube-face face-back"></div>
          <div class="cube-face face-top"></div>
          <div class="cube-face face-bottom"></div>
        </div>
      </div>
    </div>

    <p class="horizon-caption" id="hz-caption" aria-live="polite"></p>

    <div class="layers-scene" id="hz-layers" aria-hidden="true">
      <button type="button" class="layers-close" id="hz-layers-close">&larr; back</button>
      <svg class="layers-svg" viewBox="0 0 480 340" preserveAspectRatio="xMidYMid meet">
        <g class="layers-box" fill="none" stroke="#8b90a6" stroke-width="1.1">
          <path pathLength="1" class="box-edge" d="M90,40 L330,40 L330,300 L90,300 Z"/>
          <path pathLength="1" class="box-edge" d="M160,10 L400,10 L400,270 L160,270 Z"/>
          <path pathLength="1" class="box-edge" d="M90,40 L160,10 M330,40 L400,10 M330,300 L400,270 M90,300 L160,270"/>
        </g>
        <g class="layer layer-1" style="animation-delay:.2s">
          <path pathLength="1" class="layer-line ll-front" d="M90,240 C140,226 160,254 210,240 C260,226 280,254 330,240" stroke="#ffcf8f"/>
          <path pathLength="1" class="layer-line ll-back"  d="M160,210 C210,196 230,224 280,210 C330,196 350,224 400,210" stroke="#ffcf8f" opacity=".45"/>
          <path pathLength="1" class="layer-line ll-conn"  d="M90,240 L160,210 M210,240 L280,210 M330,240 L400,210" stroke="#ffcf8f" opacity=".3"/>
        </g>
        <g class="layer layer-2" style="animation-delay:.45s">
          <path pathLength="1" class="layer-line ll-front" d="M90,190 C140,176 160,204 210,190 C260,176 280,204 330,190" stroke="#ffab7a"/>
          <path pathLength="1" class="layer-line ll-back"  d="M160,160 C210,146 230,174 280,160 C330,146 350,174 400,160" stroke="#ffab7a" opacity=".45"/>
          <path pathLength="1" class="layer-line ll-conn"  d="M90,190 L160,160 M210,190 L280,160 M330,190 L400,160" stroke="#ffab7a" opacity=".3"/>
        </g>
        <g class="layer layer-3" style="animation-delay:.7s">
          <path pathLength="1" class="layer-line ll-front" d="M90,140 C140,126 160,154 210,140 C260,126 280,154 330,140" stroke="#ff8383"/>
          <path pathLength="1" class="layer-line ll-back"  d="M160,110 C210,96 230,124 280,110 C330,96 350,124 400,110" stroke="#ff8383" opacity=".45"/>
          <path pathLength="1" class="layer-line ll-conn"  d="M90,140 L160,110 M210,140 L280,110 M330,140 L400,110" stroke="#ff8383" opacity=".3"/>
        </g>
        <g class="layer layer-4" style="animation-delay:.95s">
          <path pathLength="1" class="layer-line ll-front" d="M90,90 C140,76 160,104 210,90 C260,76 280,104 330,90" stroke="#e0567a"/>
          <path pathLength="1" class="layer-line ll-back"  d="M160,60 C210,46 230,74 280,60 C330,46 350,74 400,60" stroke="#e0567a" opacity=".45"/>
          <path pathLength="1" class="layer-line ll-conn"  d="M90,90 L160,60 M210,90 L280,60 M330,90 L400,60" stroke="#e0567a" opacity=".3"/>
        </g>
      </svg>
      <div class="layer-label ly-1"><b>Candela</b>Buena Vista Social Club</div>
      <div class="layer-label ly-2"><b>Mambeando</b>Onda Vaga</div>
      <div class="layer-label ly-3"><b>The Pot</b>Tool</div>
      <div class="layer-label ly-4"><b>She</b>Green Day</div>
    </div>
  </div>

</div>
<script>
(function(){
  var caption = document.getElementById('hz-caption');
  var cubeScene = document.getElementById('cube-scene');
  var cube = document.getElementById('hz-cube');
  var layers = document.getElementById('hz-layers');
  var closeBtn = document.getElementById('hz-layers-close');

  function hideCaption(){
    caption.classList.remove('is-visible');
    caption.textContent = '';
  }
  function showCaption(text){
    hideCaption();
    requestAnimationFrame(function(){
      caption.textContent = text;
      caption.classList.add('is-visible');
    });
  }
  function openLayers(){
    hideCaption();
    cubeScene.classList.add('is-hidden');
    layers.classList.add('is-open');
    layers.setAttribute('aria-hidden', 'false');
  }
  function closeLayers(){
    layers.classList.remove('is-open');
    layers.setAttribute('aria-hidden', 'true');
    cubeScene.classList.remove('is-hidden');
  }

  var reveals = {
    books: "A standing seat at the local reading club.",
    art: "Documentaries and small stages, more than blockbusters."
  };

  cube.querySelectorAll('.cube-face[data-topic]').forEach(function(face){
    face.addEventListener('click', function(e){
      e.stopPropagation();
      var topic = face.getAttribute('data-topic');
      if (topic === 'music') { openLayers(); }
      else { showCaption(reveals[topic]); }
    });
  });

  closeBtn.addEventListener('click', function(e){ e.stopPropagation(); closeLayers(); });

  document.addEventListener('click', function(e){
    if (!layers.classList.contains('is-open')) hideCaption();
  });
})();
</script>
</body>
</html>
