<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inside the Horizon — Giada Caneva Santoro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,560;1,9..144,420;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/hero.css">
</head>
<body>
<div class="hero-page horizon-page">

  <a class="hero-name" href="index.html">Giada Caneva Santoro</a>
  <nav class="about-nav-links">
    <a href="about.html">About</a>
    <a href="research.html">Research</a>
    <a href="publications.html">Publications</a>
    <a href="talks.html">Talks &amp; CV</a>
  </nav>

  <div class="horizon-stage">
    <p class="horizon-eyebrow">a few things, quietly</p>

    <div class="horizon-row">
      <button type="button" class="horizon-item" id="hz-music" data-tree="hz-tree" aria-expanded="false" aria-controls="hz-tree">
        <svg class="horizon-icon-svg" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="21" cy="43" rx="7" ry="5" transform="rotate(-18 21 43)"/>
          <line x1="27.5" y1="41.5" x2="27.5" y2="12"/>
          <path d="M27.5,12 C38,14 40,23 31,27"/>
        </svg>
        <span class="sr-only">Music</span>
      </button>

      <button type="button" class="horizon-item" data-reveal="A standing seat at the local reading club.">
        <svg class="horizon-icon-svg" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="30" y1="14" x2="30" y2="48"/>
          <path d="M8,18 C16,12 24,13 30,17 L30,47 C24,43 16,42 8,47 Z"/>
          <path d="M52,18 C44,12 36,13 30,17 L30,47 C36,43 44,42 52,47 Z"/>
        </svg>
        <span class="sr-only">Books</span>
      </button>

      <button type="button" class="horizon-item" data-reveal="Documentaries and small stages, more than blockbusters.">
        <svg class="horizon-icon-svg" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M30,10 C44,10 52,20 52,32 C52,40 46,42 40,40 C36,38.5 33,40 33,44 C33,48 29,50 24,48 C12,44 8,36 8,28 C8,16 17,10 30,10 Z"/>
          <circle cx="24" cy="26" r="4"/>
          <circle cx="18" cy="34" r="2.6" fill="#ffb37a" stroke="none"/>
          <circle cx="31" cy="19.5" r="2.6" fill="#a99bff" stroke="none"/>
          <circle cx="43" cy="30" r="2.6" fill="#7fe3e3" stroke="none"/>
        </svg>
        <span class="sr-only">Art</span>
      </button>
    </div>

    <p class="horizon-caption" aria-live="polite"></p>

    <ul class="horizon-tree song-list" id="hz-tree" aria-hidden="true">
      <li class="song-item"><b>Candela</b>Buena Vista Social Club</li>
      <li class="song-item"><b>Mambeando</b>Onda Vaga</li>
      <li class="song-item"><b>The Pot</b>Tool</li>
      <li class="song-item"><b>She</b>Green Day</li>
    </ul>
  </div>

</div>
<script>
(function(){
  var items = document.querySelectorAll('.horizon-item');
  var caption = document.querySelector('.horizon-caption');
  var musicBtn = document.getElementById('hz-music');
  var tree = document.getElementById('hz-tree');

  function closeTree(){
    musicBtn.classList.remove('is-active');
    musicBtn.setAttribute('aria-expanded', 'false');
    tree.classList.remove('is-open');
    tree.setAttribute('aria-hidden', 'true');
  }
  function openTree(){
    items.forEach(function(i){ i.classList.remove('is-active'); });
    hideCaption();
    musicBtn.classList.add('is-active');
    musicBtn.setAttribute('aria-expanded', 'true');
    tree.classList.add('is-open');
    tree.setAttribute('aria-hidden', 'false');
  }
  function showCaption(el){
    closeTree();
    items.forEach(function(i){ i.classList.remove('is-active'); });
    el.classList.add('is-active');
    caption.textContent = el.getAttribute('data-reveal');
    caption.classList.add('is-visible');
  }
  function hideCaption(){
    caption.classList.remove('is-visible');
    caption.textContent = '';
  }
  function hideAll(){
    items.forEach(function(i){ i.classList.remove('is-active'); });
    hideCaption();
    closeTree();
  }

  musicBtn.addEventListener('mouseenter', function(){ openTree(); });
  musicBtn.addEventListener('focus', function(){ openTree(); });
  musicBtn.addEventListener('click', function(e){
    e.stopPropagation();
    openTree();
  });

  items.forEach(function(el){
    if (el === musicBtn) return;
    el.addEventListener('mouseenter', function(){ showCaption(el); });
    el.addEventListener('focus', function(){ showCaption(el); });
    el.addEventListener('click', function(e){ e.stopPropagation(); showCaption(el); });
  });

  document.querySelector('.horizon-stage').addEventListener('mouseleave', function(){
    if (!document.activeElement || !document.activeElement.classList.contains('horizon-item')) hideAll();
  });
  document.addEventListener('click', function(){ hideAll(); });
})();
</script>
</body>
</html>
